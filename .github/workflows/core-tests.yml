name: Python core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project Python files
        run: python -m compileall -q config core llm memory security storage tools ui
      - name: Test incremental speech primitives
        run: python tests/test_streaming_speech.py
      - name: Test conversation history storage
        run: python tests/test_conversation_history.py
      - name: Test HUD preferences
        run: python tests/test_hud_preferences.py
      - name: Test local control commands
        run: python tests/test_control_commands.py
